  <!-- Statistics -->
  <text x="800" y="1600" font-size="14" font-weight="bold" fill="#2c3e50">Statistics:</text>
  <text x="800" y="1625" font-size="12" fill="#34495e">• Total Models: 80+</text>
  <text x="800" y="1650" font-size="12" fill="#34495e">• Total Associations: 200+</text>
  <text x="800" y="1675" font-size="12" fill="#34495e">• Key Hub Models: Vehicle, PurchaseOrder, Maintenance, Inspection</text>
  <text x="800" y="1700" font-size="12" fill="#34495e">• Multi-tenancy: 40+ models use agency_id for organization isolation</text>

  <!-- Cross-Domain Connection Examples -->
  <line x1="800" y1="300" x2="900" y2="140" class="relationship-line" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.6"/>
  <text x="830" y="215" class="relationship-label" fill="#e74c3c">Vehicle →</text>
  <text x="830" y="235" class="relationship-label" fill="#e74c3c">PurchaseOrder</text>

  <line x1="800" y1="560" x2="900" y2="360" class="relationship-line" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.6"/>
  <text x="810" y="460" class="relationship-label" fill="#27ae60">Maintenance →</text>
  <text x="810" y="480" class="relationship-label" fill="#27ae60">Part</text>

</svg>