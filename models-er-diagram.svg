  <!-- Legend -->
  <text x="50" y="1600" font-size="14" font-weight="bold" fill="#2c3e50">Legend:</text>
  <line x1="50" y1="1620" x2="100" y2="1620" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="110" y="1625" font-size="12" fill="#34495e">One-to-Many Relationship</text>

  <line x1="50" y1="1650" x2="100" y2="1650" class="relationship-line one-to-many" marker-end="url(#arrowhead)"/>
