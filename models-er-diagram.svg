  <text x="1110" y="160" class="model-text">• belongs_to rfq</text>
  <text x="1110" y="175" class="model-text">• has_many items</text>
  <text x="1110" y="190" class="model-text">• total_price</text>
  <text x="1110" y="205" class="model-text">• status enum</text>
  <text x="1110" y="220" class="model-text">• created_by user</text>

