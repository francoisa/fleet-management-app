  <line x1="1250" y1="140" x2="1300" y2="140" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="1262" y="135" class="relationship-label">belongs_to</text>

  <line x1="1450" y1="140" x2="1500" y2="140" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="1462" y="135" class="relationship-label">has_many</text>

