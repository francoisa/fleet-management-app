  <text x="1110" y="435" class="model-text">• has_many parts</text>
  <text x="1110" y="450" class="model-text">• template_name</text>
  <text x="1110" y="465" class="model-text">• description</text>
  <text x="1110" y="480" class="model-text">• estimated_cost</text>

  <!-- Invoice -->
  <rect x="1300" y="360" width="150" height="130" class="model-box" rx="4"/>
