  <text x="910" y="175" class="model-text">• has_many invoices</text>
  <text x="910" y="190" class="model-text">• total_amount</text>
  <text x="910" y="205" class="model-text">• status enum</text>
  <text x="910" y="220" class="model-text">• approval chain</text>

