  <text x="1310" y="175" class="model-text">• has_many quotations</text>
  <text x="1310" y="190" class="model-text">• has_many line_items</text>
  <text x="1310" y="205" class="model-text">• status enum</text>
  <text x="1310" y="220" class="model-text">• type: maintenance/parts</text>

