  <text x="1510" y="145" class="model-text">• has_many quotations</text>
  <text x="1510" y="160" class="model-text">• has_many purchase_orders</text>
  <text x="1510" y="175" class="model-text">• has_many parts</text>
  <text x="1510" y="190" class="model-text">• name, contact info</text>
  <text x="1510" y="205" class="model-text">• rating, status</text>
  <text x="1510" y="220" class="model-text">• payment_terms</text>

