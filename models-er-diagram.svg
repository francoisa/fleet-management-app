  <text x="910" y="405" class="model-text">• belongs_to supplier</text>
  <text x="910" y="420" class="model-text">• has_many maintenances</text>
  <text x="910" y="435" class="model-text">• has_many purchase_orders</text>
  <text x="910" y="450" class="model-text">• part_number</text>
  <text x="910" y="465" class="model-text">• stock_quantity</text>
  <text x="910" y="480" class="model-text">• unit_price</text>

  <!-- JobTemplate -->
  <rect x="1100" y="360" width="150" height="130" class="model-box" rx="4"/>
