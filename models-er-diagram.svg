  <line x1="200" y1="610" x2="250" y2="610" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="215" y="605" class="relationship-label">has_many</text>

  <line x1="200" y1="625" x2="450" y2="600" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="310" y="600" class="relationship-label">has_many</text>

  <line x1="400" y1="620" x2="450" y2="610" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="415" y="610" class="relationship-label">has_many</text>

  <line x1="400" y1="630" x2="650" y2="620" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="515" y="620" class="relationship-label">has_many</text>

