  <text x="1310" y="465" class="model-text">• invoice_date</text>
  <text x="1310" y="480" class="model-text">• status enum</text>

  <!-- Payable -->
  <rect x="1500" y="360" width="150" height="130" class="model-box" rx="4"/>
