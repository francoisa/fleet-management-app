<svg viewBox="0 0 2400 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .model-box { fill: #e8f4f8; stroke: #2c3e50; stroke-width: 2; }
      .model-title { font-weight: bold; font-size: 14px; fill: #2c3e50; }
      .model-text { font-size: 11px; fill: #34495e; }
      .relationship-line { stroke: #7f8c8d; stroke-width: 2; fill: none; }
      .relationship-label { font-size: 10px; fill: #2c3e50; font-weight: 500; }
      .domain-label { font-size: 16px; font-weight: bold; fill: #34495e; opacity: 0.6; }
      .arrow { fill: #7f8c8d; }
      .one-to-many { stroke-dasharray: 5,5; }
      .many-to-many { stroke-dasharray: 10,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="2400" height="1800" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="1200" y="30" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Fleet Management App - Model Relationships
  </text>

  <!-- ORGANIZATION & ACCESS CONTROL Domain -->
  <text x="50" y="80" class="domain-label">ORGANIZATION &amp; ACCESS CONTROL</text>

  <!-- Agency -->
  <rect x="50" y="100" width="140" height="100" class="model-box" rx="4"/>
  <text x="60" y="125" class="model-title">Agency</text>
  <text x="60" y="145" class="model-text">• has_many users</text>
  <text x="60" y="160" class="model-text">• has_many vehicles</text>
  <text x="60" y="175" class="model-text">• has_many drivers</text>
  <text x="60" y="190" class="model-text">• has_many accounts</text>

  <!-- User -->
  <rect x="220" y="100" width="140" height="100" class="model-box" rx="4"/>
  <text x="230" y="125" class="model-title">User</text>
  <text x="230" y="145" class="model-text">• belongs_to agency</text>
  <text x="230" y="160" class="model-text">• has_many sessions</text>
  <text x="230" y="175" class="model-text">• has_many quotations</text>
  <text x="230" y="190" class="model-text">• has_many audit_logs</text>

  <!-- Account -->
  <rect x="390" y="100" width="140" height="100" class="model-box" rx="4"/>
  <text x="400" y="125" class="model-title">Account</text>
  <text x="400" y="145" class="model-text">• belongs_to agency</text>
  <text x="400" y="160" class="model-text">• has_many transactions</text>
  <text x="400" y="175" class="model-text">• has_many payables</text>
  <text x="400" y="190" class="model-text">• account_type enum</text>

  <!-- Relationships: Agency-User -->
  <line x1="190" y1="140" x2="220" y2="140" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="202" y="135" class="relationship-label">has_many</text>

  <!-- Relationships: Agency-Account -->
  <line x1="190" y1="155" x2="390" y2="155" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="285" y="150" class="relationship-label">has_many</text>

  <!-- FLEET MANAGEMENT Domain -->
  <text x="50" y="280" class="domain-label">FLEET MANAGEMENT</text>

  <!-- Vehicle -->
  <rect x="50" y="300" width="150" height="130" class="model-box" rx="4"/>
  <text x="60" y="325" class="model-title">Vehicle</text>
  <text x="60" y="345" class="model-text">• polymorphic owner</text>
  <text x="60" y="360" class="model-text">• belongs_to driver</text>
  <text x="60" y="375" class="model-text">• has_many inspections</text>
  <text x="60" y="390" class="model-text">• has_many maintenances</text>
  <text x="60" y="405" class="model-text">• has_many trips</text>
  <text x="60" y="420" class="model-text">• has_many alerts</text>

  <!-- Driver -->
  <rect x="250" y="300" width="150" height="130" class="model-box" rx="4"/>
  <text x="260" y="325" class="model-title">Driver</text>
  <text x="260" y="345" class="model-text">• belongs_to agency</text>
  <text x="260" y="360" class="model-text">• has_many vehicles</text>
  <text x="260" y="375" class="model-text">• has_many trips</text>
  <text x="260" y="390" class="model-text">• has_many alerts</text>
  <text x="260" y="405" class="model-text">• has_many damage_reports</text>
  <text x="260" y="420" class="model-text">• license_number</text>

  <!-- Trip -->
  <rect x="450" y="300" width="150" height="130" class="model-box" rx="4"/>
  <text x="460" y="325" class="model-title">Trip</text>
  <text x="460" y="345" class="model-text">• belongs_to vehicle</text>
  <text x="460" y="360" class="model-text">• belongs_to driver</text>
  <text x="460" y="375" class="model-text">• has_many alerts</text>
  <text x="460" y="390" class="model-text">• has_many damage_reports</text>
  <text x="460" y="405" class="model-text">• status enum</text>
  <text x="460" y="420" class="model-text">• route tracking</text>

  <!-- Alert -->
  <rect x="650" y="300" width="150" height="130" class="model-box" rx="4"/>
  <text x="660" y="325" class="model-title">Alert</text>
  <text x="660" y="345" class="model-text">• belongs_to agency</text>
  <text x="660" y="360" class="model-text">• belongs_to vehicle</text>
  <text x="660" y="375" class="model-text">• belongs_to trip (optional)</text>
  <text x="660" y="390" class="model-text">• alert_type enum</text>
  <text x="660" y="405" class="model-text">• severity enum</text>
  <text x="660" y="420" class="model-text">• status tracking</text>

  <!-- Relationships in Fleet Management -->
  <line x1="200" y1="360" x2="250" y2="360" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="215" y="355" class="relationship-label">has_many</text>

  <line x1="200" y1="385" x2="450" y2="360" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="320" y="360" class="relationship-label">has_many</text>

  <line x1="400" y1="350" x2="450" y2="350" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="415" y="345" class="relationship-label">has_many</text>

  <line x1="200" y1="350" x2="650" y2="350" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="420" y="345" class="relationship-label">has_many</text>

  <line x1="600" y1="360" x2="650" y2="360" class="relationship-line" marker-end="url(#arrowhead)"/>
  <text x="615" y="355" class="relationship-label">has_many</text>

  <!-- MAINTENANCE & REPAIRS Domain -->
  <text x="50" y="540" class="domain-label">MAINTENANCE &amp; REPAIRS</text>

  <!-- Inspection -->
  <rect x="50" y="560" width="150" height="130" class="model-box" rx="4"/>
  <text x="60" y="585" class="model-title">Inspection</text>
  <text x="60" y="605" class="model-text">• belongs_to vehicle</text>
  <text x="60" y="620" class="model-text">• has_many inspection_items</text>
  <text x="60" y="635" class="model-text">• has_many findings</text>
  <text x="60" y="650" class="model-text">• inspector_id</text>
  <text x="60" y="665" class="model-text">• inspection_date</text>
  <text x="60" y="680" class="model-text">• status enum</text>

  <!-- Maintenance -->
  <rect x="250" y="560" width="150" height="130" class="model-box" rx="4"/>
  <text x="260" y="585" class="model-title">Maintenance</text>
  <text x="260" y="605" class="model-text">• belongs_to vehicle</text>
  <text x="260" y="620" class="model-text">• has_many parts</text>
  <text x="260" y="635" class="model-text">• has_many job_tasks</text>
  <text x="260" y="650" class="model-text">• has_many labor_logs</text>
  <text x="260" y="665" class="model-text">• cost tracking</text>
  <text x="260" y="680" class="model-text">• status enum</text>

  <!-- MaintenanceRequest -->
  <rect x="450" y="560" width="150" height="130" class="model-box" rx="4"/>
  <text x="460" y="585" class="model-title">MaintenanceRequest</text>
  <text x="460" y="605" class="model-text">• belongs_to vehicle</text>
  <text x="460" y="620" class="model-text">• belongs_to requesting_agency</text>
  <text x="460" y="635" class="model-text">• belongs_to processing_agency</text>
  <text x="460" y="650" class="model-text">• has_many quotations</text>
  <text x="460" y="665" class="model-text">• status enum</text>
  <text x="460" y="680" class="model-text">• priority level</text>

  <!-- JobTask -->
  <rect x="650" y="560" width="150" height="130" class="model-box" rx="4"/>
  <text x="660" y="585" class="model-title">JobTask</text>
  <text x="660" y="605" class="model-text">• belongs_to maintenance</text>
  <text x="660" y="620" class="model-text">• belongs_to job_template</text>
